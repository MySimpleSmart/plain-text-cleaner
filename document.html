<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Back to home"><img src="/text-cleaner-logo.svg" alt="" width="22" height="22"><span>Plain Text Cleaner</span></a>

    <div class="top-actions">
      <button id="clear" class="icon-button" disabled aria-label="Clear document" title="Clear document"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
      <button id="copy" class="copy" disabled>COPY</button>
    </div>
  </header>
  <main class="workspace">
    <section class="source-pane" aria-labelledby="source-title">
      <div class="pane-heading"><h1 id="source-title">Source</h1><span>Editable text</span></div>
      <p class="source-note">Paste text, tables, lists or LaTeX, or send cleaned text from Clean Text. The document updates in your browser.</p>
      <textarea id="source" aria-label="Document source" placeholder="Paste or type text here…" maxlength="100000" spellcheck="false"></textarea>
      <p class="status" id="source-status">Nothing pasted yet</p>
    </section>
    <section class="preview-pane" aria-labelledby="preview-title">
      <div class="pane-heading"><h2 id="preview-title">Document</h2><span>Structure preview</span></div>
      <div class="paper"><div id="content" class="document-content"><p class="empty">Your document will appear here.</p></div></div>
      <p class="status" id="document-status" role="status" aria-live="polite">Ready</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/vendor/katex/katex.min.js" integrity="sha256-+hQEmLjPyDAsvl58sb28H5Urw4s/oljt4J5z7b+adLw=" crossorigin="anonymous"></script>
  <script id="document-app">
    const source = document.getElementById('source');
    const content = document.getElementById('content');
    const copyButton = document.getElementById('copy');
    const clearButton = document.getElementById('clear');
    const status = document.getElementById('document-status');
    const toast = document.getElementById('toast');
    const MAX_SOURCE = 100000;
    const transferKey = 'plain-text-cleaner.document-transfer.v1';
    const MAX_TABLE_ROWS = 1000;
    const MAX_TABLE_COLUMNS = 50;
    let blocks = [];
    let renderTimer;
    let copyTimer;
    let toastTimer;

    const ignoreTags = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEMPLATE', 'IFRAME', 'FRAME', 'OBJECT', 'EMBED', 'SVG', 'IMG', 'PICTURE', 'SOURCE', 'VIDEO', 'AUDIO', 'FORM', 'LINK', 'META']);
    const tidy = value => value.replace(/\r\n?/g, '\n').replace(/[\u00a0\u2000-\u200a\u202f\u205f\u3000]/gu, ' ').replace(/[ \t]+/gu, ' ').trim();

    function inlineText(node) {
      if (node.nodeType === Node.TEXT_NODE) return node.nodeValue;
      if (node.nodeType !== Node.ELEMENT_NODE || ignoreTags.has(node.tagName)) return '';
      if (node.tagName === 'BR') return '\n';
      if (node.tagName === 'UL' || node.tagName === 'OL' || node.tagName === 'TABLE') return '';
      return [...node.childNodes].map(inlineText).join('');
    }

    function tableSource(table) {
      const rows = [...table.querySelectorAll('tr')].slice(0, MAX_TABLE_ROWS);
      if (!rows.length) return '';
      return rows.map(row => [...row.children].filter(cell => cell.matches('th,td')).slice(0, MAX_TABLE_COLUMNS)
        .map(cell => tidy(inlineText(cell)).replace(/\s*\n\s*/gu, ' ')).join('\t')).join('\n');
    }

    function listSource(list, level = 0) {
      if (level > 8) return '';
      const ordered = list.tagName === 'OL';
      let next = Number(list.getAttribute('start')) || 1;
      const lines = [];
      for (const item of [...list.children].filter(child => child.tagName === 'LI')) {
        const number = Number(item.getAttribute('value')) || next;
        const text = tidy([...item.childNodes].map(inlineText).join(''));
        lines.push('  '.repeat(level) + (ordered ? `${number}. ` : '• ') + text);
        for (const nested of [...item.children].filter(child => child.matches('ul,ol'))) lines.push(listSource(nested, level + 1));
        next = number + 1;
      }
      return lines.filter(Boolean).join('\n');
    }

    function richSource(html) {
      if (html.length > 1000000 || !/<(?:table|ol|ul|math)\b/iu.test(html)) return null;
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      const parts = [];
      const walk = (node, depth = 0) => {
        if (depth > 32) return;
        if (node.nodeType === Node.TEXT_NODE) { const value = tidy(node.nodeValue); if (value) parts.push(value); return; }
        if (node.nodeType !== Node.ELEMENT_NODE || ignoreTags.has(node.tagName)) return;
        if (node.tagName === 'TABLE') { const value = tableSource(node); if (value) parts.push(value); return; }
        if (node.tagName === 'UL' || node.tagName === 'OL') { const value = listSource(node); if (value) parts.push(value); return; }
        if (node.tagName === 'MATH') {
          const latex = node.querySelector('annotation[encoding="application/x-tex"]')?.textContent;
          if (latex) parts.push('\\[' + latex + '\\]');
          else if (node.textContent.trim()) parts.push(tidy(node.textContent));
          return;
        }
        if (/^H[1-6]$/u.test(node.tagName)) { const value = tidy(inlineText(node)); if (value) parts.push('#'.repeat(Number(node.tagName[1])) + ' ' + value); return; }
        if (['P', 'PRE', 'BLOCKQUOTE', 'LI'].includes(node.tagName)) { const value = tidy(inlineText(node)); if (value) parts.push(value); return; }
        for (const child of node.childNodes) walk(child, depth + 1);
      };
      walk(parsed.body);
      return parts.length ? parts.join('\n\n') : null;
    }

    function listItem(line) {
      const match = line.match(/^([ \t]*)(?:(\d+)[.)]|([-+*•☑☐]))[ \t]+(.+)$/u);
      if (!match) return null;
      return { indent: Math.min(match[1].replace(/\t/gu, '  ').length, 16), ordered: Boolean(match[2]), number: match[2] ? Number(match[2]) : null, text: tidy(match[4]), marker: match[3] || null };
    }

    function pipeCells(line) {
      const trimmed = line.trim();
      if (!trimmed.includes('|')) return null;
      return trimmed.replace(/^\|/u, '').replace(/\|$/u, '').split(/(?<!\\)\|/u).map(cell => tidy(cell.replace(/\\\|/gu, '|')));
    }

    function pairedTable(lines, start) {
      if (lines[start].trim().length > 40 || /[.!?]$/u.test(lines[start].trim())) return null;
      const cells = [], positions = [];
      let end = start;
      while (end < lines.length && cells.length < 2 * MAX_TABLE_ROWS) {
        if (!lines[end].trim()) {
          if (!lines[end + 1]?.trim()) break;
          end++; continue;
        }
        cells.push(tidy(lines[end++])); positions.push(end);
      }
      if (cells.length < 8 || cells[0].length > 40 || cells[1].length > 40) return null;
      let count = cells.length - cells.length % 2;
      while (count >= 8 && !isPairedTableCells(cells.slice(0, count))) count -= 2;
      if (count < 8) return null;
      const rows = [];
      for (let index = 0; index < count; index += 2) rows.push([cells[index], cells[index + 1]]);
      return { rows, end: positions[count - 1] };
    }

    function isPairedTableCells(cells) {
      const firstColumn = cells.filter((_, index) => index % 2 === 0);
      if (!firstColumn.every(cell => cell.length <= 70 && !/[.!?]$/u.test(cell) && !listItem(cell))) return false;
      const labelRows = firstColumn.slice(1).filter(cell => /^\[[^\]]+\]$/u.test(cell) || /^[\p{L}\p{N}_ ,/()%-]+$/u.test(cell));
      return labelRows.length >= firstColumn.length - 2;
    }

    function parseDocument(value) {
      const lines = value.replace(/\r\n?/g, '\n').split('\n');
      const result = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        const bareMath = line.trim() === '[' && /^\s*\\(?:boxed|begin|frac|sum|sqrt|left|text|bar|overline)\b/u.test(lines[i + 1] || '');
        const opening = bareMath ? ['[', '[', ''] : line.match(/^\s*(\\\[|\$\$)\s*(.*)$/u);
        if (opening) {
          const closing = opening[1] === '$$' ? '$$' : opening[1] === '[' ? ']' : '\\]';
          let latex = opening[2], end = i;
          const inlineEnd = latex.indexOf(closing);
          if (inlineEnd !== -1) latex = latex.slice(0, inlineEnd);
          else while (++end < lines.length) {
            const found = lines[end].indexOf(closing);
            if (found !== -1) { latex += '\n' + lines[end].slice(0, found); break; }
            latex += '\n' + lines[end];
          }
          if (inlineEnd !== -1 || end < lines.length) { result.push({ type: 'formula', latex: latex.trim() }); i = inlineEnd !== -1 ? i + 1 : end + 1; continue; }
        }
        if (/^\s*\\begin\{(?:aligned|align|gather|equation)/u.test(line)) {
          const formulaLines = [line]; i++;
          while (i < lines.length && formulaLines.length < 100) { formulaLines.push(lines[i]); if (/\\end\{/u.test(lines[i++])) break; }
          result.push({ type: 'formula', latex: formulaLines.join('\n') }); continue;
        }
        if (line.length <= 500 && (/^\s*\\(?:boxed|frac|sum|sqrt)\b/u.test(line) || /[=≈].*(?:\\(?:sum|frac|boxed|bar|sqrt|cdot)\b|[_^]\{)/u.test(line))) {
          result.push({ type: 'formula', latex: line.trim() }); i++; continue;
        }
        if (line.includes('\t')) {
          const rows = [];
          while (i < lines.length && lines[i].includes('\t') && rows.length < MAX_TABLE_ROWS) rows.push(lines[i++].split('\t').slice(0, MAX_TABLE_COLUMNS).map(tidy));
          if (rows.some(row => row.length > 1)) { result.push({ type: 'table', rows }); continue; }
        }
        const header = pipeCells(line), separator = pipeCells(lines[i + 1] || '');
        if (header?.length >= 2 && separator?.length === header.length && separator.every(cell => /^:?-{3,}:?$/u.test(cell))) {
          const rows = [header]; i += 2;
          while (i < lines.length && pipeCells(lines[i])?.length === header.length && rows.length < MAX_TABLE_ROWS) rows.push(pipeCells(lines[i++]));
          result.push({ type: 'table', rows }); continue;
        }
        const paired = pairedTable(lines, i);
        if (paired) { result.push({ type: 'table', rows: paired.rows }); i = paired.end; continue; }
        const item = listItem(line);
        if (item) {
          const items = [item]; i++;
          while (i < lines.length) {
            const next = listItem(lines[i]);
            if (next) { items.push(next); i++; continue; }
            if (!lines[i].trim() && listItem(lines[i + 1] || '')) { i++; continue; }
            break;
          }
          result.push({ type: 'list', items }); continue;
        }
        const heading = line.match(/^\s*(#{1,6})\s+(.+)$/u);
        if (heading) { result.push({ type: 'heading', level: heading[1].length, text: tidy(heading[2]) }); i++; continue; }
        if (/^\s*(`{3,}|~{3,})/u.test(line)) {
          const fence = line.trim().slice(0, 3), code = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith(fence)) code.push(lines[i++]);
          if (i < lines.length) i++;
          result.push({ type: 'code', text: code.join('\n') }); continue;
        }
        const paragraph = [line.trim()]; i++;
        while (i < lines.length && lines[i].trim() && !lines[i].includes('\t') && !listItem(lines[i]) && !/^\s*(?:\\\[|\$\$|#{1,6}\s|`{3,}|~{3,})/u.test(lines[i])) paragraph.push(lines[i++].trim());
        result.push({ type: 'paragraph', text: paragraph.join(' ') });
      }
      return result;
    }

    function renderInline(text, parent) {
      const pattern = /\\\(([\s\S]*?)\\\)|\$([^$\n]+)\$/gu;
      let cursor = 0;
      for (const match of text.matchAll(pattern)) {
        parent.append(document.createTextNode(text.slice(cursor, match.index)));
        const formula = document.createElement('span');
        try { katex.render(match[1] || match[2], formula, { throwOnError: true, trust: false, maxSize: 8, maxExpand: 1000 }); }
        catch { formula.className = 'formula-error'; formula.textContent = match[0]; }
        parent.append(formula);
        cursor = match.index + match[0].length;
      }
      parent.append(document.createTextNode(text.slice(cursor)));
    }

    function renderList(items, parent) {
      const stack = [];
      for (const item of items) {
        while (stack.length && item.indent < stack.at(-1).indent) stack.pop();
        let current = stack.at(-1);
        if (current && item.indent === current.indent && item.ordered !== current.ordered) { stack.pop(); current = stack.at(-1); }
        if (!current || item.indent > current.indent || item.ordered !== current.ordered) {
          const list = document.createElement(item.ordered ? 'ol' : 'ul');
          if (item.ordered) list.start = item.number;
          (current && item.indent > current.indent ? current.lastItem : parent)?.append(list);
          current = { indent: item.indent, ordered: item.ordered, list, lastItem: null };
          stack.push(current);
        }
        const li = document.createElement('li');
        if (item.ordered) li.value = item.number;
        renderInline(item.text, li);
        current.list.append(li);
        current.lastItem = li;
      }
    }

    function render() {
      clearTimeout(renderTimer);
      blocks = parseDocument(source.value);
      content.replaceChildren();
      if (!blocks.length) {
        const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'Your document will appear here.';
        content.append(empty);
      }
      for (const block of blocks) {
        if (block.type === 'list') { renderList(block.items, content); continue; }
        if (block.type === 'table') {
          const table = document.createElement('table'), body = document.createElement('tbody');
          for (const [index, cells] of block.rows.entries()) {
            const row = document.createElement('tr');
            for (const value of cells) { const cell = document.createElement(index === 0 ? 'th' : 'td'); cell.textContent = value; row.append(cell); }
            body.append(row);
          }
          table.append(body); content.append(table); continue;
        }
        if (block.type === 'formula') {
          const holder = document.createElement('div'); holder.className = 'formula';
          try { katex.render(block.latex, holder, { displayMode: true, throwOnError: true, trust: false, maxSize: 8, maxExpand: 1000 }); }
          catch { holder.classList.add('formula-error'); holder.textContent = '\\[' + block.latex + '\\]'; }
          content.append(holder); continue;
        }
        const element = document.createElement(block.type === 'heading' ? `h${block.level}` : block.type === 'code' ? 'pre' : 'p');
        if (block.type === 'code') element.textContent = block.text;
        else renderInline(block.text, element);
        content.append(element);
      }
      document.getElementById('source-status').textContent = source.value ? `${source.value.length.toLocaleString()} characters` : 'Nothing pasted yet';
      const tables = blocks.filter(block => block.type === 'table').length;
      const lists = blocks.filter(block => block.type === 'list').length;
      const formulas = blocks.filter(block => block.type === 'formula').length;
      status.textContent = source.value ? `${blocks.length} blocks · ${tables} tables · ${lists} lists · ${formulas} formulas` : 'Ready';
      clearButton.disabled = !source.value;
      copyButton.disabled = !source.value.trim() || copyButton.classList.contains('copied');
    }

    function showToast(text) {
      clearTimeout(toastTimer);
      toast.textContent = text; toast.classList.add('visible');
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    source.addEventListener('input', () => { clearTimeout(renderTimer); renderTimer = setTimeout(render, 80); });
    source.addEventListener('paste', event => {
      const plain = event.clipboardData?.getData('text/plain') || '';
      const html = event.clipboardData?.getData('text/html') || '';
      const value = richSource(html) || plain;
      if (!value) return;
      event.preventDefault();
      if (source.value.length - (source.selectionEnd - source.selectionStart) + value.length > MAX_SOURCE) { showToast('Document limit: 100,000 characters'); return; }
      source.setRangeText(value, source.selectionStart, source.selectionEnd, 'end');
      render();
    });
    clearButton.addEventListener('click', () => { source.value = ''; render(); source.focus(); showToast('Document cleared'); });
    copyButton.addEventListener('click', async () => {
      if (!source.value.trim()) return;
      const plain = source.value;
      const html = `<html><head><meta charset="utf-8"></head><body>${content.innerHTML}</body></html>`;
      try {
        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({
            'text/plain': new Blob([plain], { type: 'text/plain' }),
            'text/html': new Blob([html], { type: 'text/html' })
          })]);
        } else await navigator.clipboard.writeText(plain);
      } catch { showToast('Could not copy · select the document and press Ctrl/Cmd+C'); return; }
      copyButton.textContent = 'COPIED'; copyButton.classList.add('copied'); copyButton.disabled = true;
      showToast('Copied with document structure');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { copyButton.textContent = 'COPY'; copyButton.classList.remove('copied'); copyButton.disabled = !source.value.trim(); }, 2600);
    });
    try {
      const transferred = sessionStorage.getItem(transferKey);
      if (transferred !== null) {
        sessionStorage.removeItem(transferKey);
        if (transferred.length <= MAX_SOURCE) source.value = transferred;
        else showToast('Document limit: 100,000 characters');
      }
    } catch { /* The document remains usable when browser storage is unavailable. */ }
    render();
  </script>
</body>
</html>
